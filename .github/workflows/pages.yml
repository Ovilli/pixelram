name: Deploy documentation to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install documentation dependencies
        working-directory: docs
        run: bundle install

      - name: Install WebAssembly toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake

          # Ubuntu 24.04 ships Emscripten 3.1.6, whose bundled GLFW headers
          # are too old for raylib 6.0. Use a pinned official emsdk instead.
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          /tmp/emsdk/emsdk install 4.0.21
          /tmp/emsdk/emsdk activate 4.0.21

          source /tmp/emsdk/emsdk_env.sh
          emcc --version

          git clone --depth 1 --branch 6.0 https://github.com/raysan5/raylib.git /tmp/raylib
          emcmake cmake -S /tmp/raylib -B /tmp/raylib-build \
            -DPLATFORM=Web -DBUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/raylib-build -j2

          echo "/tmp/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
          echo "EMSDK=/tmp/emsdk" >> "$GITHUB_ENV"
          echo "EM_CONFIG=/tmp/emsdk/.emscripten" >> "$GITHUB_ENV"

      - name: Build live PixelRAM demos
        run: |
          mkdir -p build
          for demo in minimal animation fire; do
            emcc -O2 -std=c11 -Wall -Wextra -Wpedantic \
              -DPLATFORM_WEB -sUSE_GLFW=3 -sASYNCIFY \
              -sSINGLE_FILE=1 -sSINGLE_FILE_BINARY_ENCODE=0 \
              --shell-file shell.html -I. -I/tmp/raylib/src \
              "examples/${demo}.c" pixelram.c \
              -L/tmp/raylib-build/raylib -lraylib \
              -o "build/${demo}.html"
          done

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build documentation
        working-directory: docs
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Add live demos to documentation
        run: |
          mkdir -p docs/_site/demos
          cp build/minimal.html build/animation.html build/fire.html docs/_site/demos/

      - name: Upload documentation
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
